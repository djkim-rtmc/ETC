<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VD-IMS 로그인 2차 인증 목업</title>
<style>
  :root {
    --pink: #e31c79;
    --pink-soft: #fde7f2;
    --text: #222;
    --muted: #8d8d8d;
    --line: #ececec;
    --border: #e5e5e5;
    --bg: #f6f7f9;
    --field: #f5f5f5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 13px;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, p { margin: 0; }
  .review { height: 100%; display: grid; grid-template-rows: auto 1fr; background: #eef0f4; }
  .tabs {
    display: flex; gap: 6px; align-items: flex-end; overflow-x: auto;
    padding: 12px 16px 0; background: #fff; border-bottom: 1px solid var(--line);

  .tabs button {
    flex: 0 0 auto; height: 36px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent;
    background: transparent; color: #666; white-space: nowrap;
  }
  .tabs button.on { color: var(--pink); border-bottom-color: var(--pink); font-weight: 700; }
  .review-body { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  .screen { min-width: 0; min-height: 0; overflow: auto; background: var(--bg); }

  .criteria ul { margin: 12px 0 0; padding-left: 18px; }
  .criteria li { margin: 0 0 10px; line-height: 1.5; }
  .app { min-height: 100%; display: grid; grid-template-rows: 56px 1fr; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px 0 16px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: -.3px; }
  .brand i { color: var(--pink); font-style: normal; }
  .top-right { display: flex; align-items: center; gap: 16px; color: #666; font-size: 12px; }
  .notice { flex: 1; margin: 0 16px; color: #888; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toggle { width: 36px; height: 20px; border-radius: 99px; background: #e5e5e5; position: relative; }
  .toggle i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .body { display: grid; grid-template-columns: 220px 1fr; min-height: 640px; }

    width: 100%; text-align: left; border: 0; border-radius: 8px; background: transparent;
    color: #555; padding: 8px 10px; font-size: 13px;

  .rail button.on { background: var(--pink-soft); color: var(--pink); font-weight: 700; }
  .inner-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .inner-tabs button {
    height: 36px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent;
    background: transparent; color: #777;
  }
  .inner-tabs button.on { color: var(--pink); border-bottom-color: var(--pink); font-weight: 700; }
  .list-head { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
  .search { display: flex; gap: 8px; margin-bottom: 8px; }

  .count { color: #666; font-size: 12px; margin: 8px 0; }

  .at { color: #888; }

  .imei-field { display: flex; flex-direction: column; gap: 6px; }

    white-space: nowrap; cursor: pointer;
  }
  .imei-del:hover { border-color: var(--pink); color: var(--pink); }
  .staff-summary { display: flex; align-items: center; gap: 0; font-size: 12px; }
  .staff-total { padding: 3px 10px; border-radius: 6px; background: var(--pink-soft); color: var(--pink); font-weight: 700; margin-right: 6px; }
  .staff-count { padding: 0 10px; color: #888; border-left: 1px solid #e5e5e5; }
  .staff-count b { color: #222; margin-left: 2px; }
  .modal.staff { width: min(620px, 100%); height: min(740px, 92vh); }
  .staff-head { padding: 20px 20px 0; }
  .staff-head h3 { font-size: 18px; margin-bottom: 12px; }
  .staff-bar { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #edf0f4; border-radius: 10px; background: #f8f9fb; }

  .staff-none { color: #ccc; }
  .staff-table .staff-del {
    display: inline-flex; align-items: center; justify-content: center; width: auto; height: 26px; padding: 0 12px;
    border: 1px solid #dfe3e8; border-radius: 4px; background: #fff; color: #666; font-size: 12px; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .staff-table .staff-del:hover { border-color: var(--pink); color: var(--pink); }
  .staff-body { flex: 1; min-height: 0; overflow-y: auto; margin: 4px 20px 14px; }

  .staff-empty span { font-size: 20px; opacity: .45; }
  .staff-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 1px solid #e6e9ee; border-radius: 8px; margin-bottom: 8px; }

  .staff-foot { padding: 0 20px 14px; }
  .staff-add { width: 100%; height: 34px; border: 1px dashed #d9dde4; border-radius: 8px; background: #fff; color: #444; font-size: 12px; }
  .staff-add:hover { border-color: var(--pink); color: var(--pink); }
  .staff-actions { display: flex; justify-content: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .confirm-body { padding: 26px 28px 6px; }

  .logo-mark { color: var(--pink); font-size: 40px; font-weight: 800; letter-spacing: -1px; }

  .inline.spread { justify-content: space-between; width: 100%; }
  .muted { color: #888; }
  .radios input { accent-color: var(--pink); }
  .btn {
    height: 34px; padding: 0 18px; border-radius: 4px; border: 1px solid var(--pink);
    background: #fff; color: var(--pink); font-weight: 700;
  }
  .btn.fill { background: var(--pink); color: #fff; }
  .btn.slim { height: 28px; padding: 0 10px; font-size: 12px; white-space: nowrap; }
  .card table { width: 100%; }
  .lock-col { white-space: nowrap; }  .card { overflow: auto; }
  .btn.ghost { border-color: #e5e5e5; color: #666; }
  .btn:disabled { background: #f2f2f2; color: #aaa; border-color: #eee; }
  .new { margin-left: 6px; font-size: 10px; color: var(--pink); font-weight: 700; }
  .hint { margin-top: 8px; color: var(--muted); font-size: 12px; }

    margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line);
    color: #9a9a9a; font-size: 11px; line-height: 1.6;
  }
  .login-wrap { min-height: 640px; display: grid; place-items: center; }
  .login-card, .mail, .choice-wrap { width: 460px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 28px 26px; }
  .login-card h2, .mail h2 { font-size: 20px; }
  .lead { margin: 8px 0 16px; color: var(--muted); }

<div class="modal-back" id="staff-modal"></div>
<script>
const orgName = "메디체크병원";
const domain = "hospital.or.kr";
const roleOptions = ["슈퍼 관리자", "병원 관리자", "병원 의사", "병원 간호사", "보건소 관리자", "보건소 의사", "보건소 간호사", "유통사 관리자", "유통사 직원"];
let profileImage = "default";
let staffList = [
  { name: "김대충", pre: true, vac: true, date: "2026.10.14 16:20" },
  { name: "이서윤", pre: true, vac: false, date: "2026.10.13 11:05" },
  { name: "박지훈", pre: false, vac: true, date: "2026.10.10 09:40" },
  { name: "최민서", pre: true, vac: true, date: "2026.10.02 14:12" },
  { name: "정하은", pre: false, vac: true, date: "2026.09.25 10:30" },
  { name: "강도윤", pre: true, vac: false, date: "2026.09.18 15:48" },
  { name: "조수아", pre: true, vac: true, date: "2026.09.03 13:22" },
  { name: "윤예준", pre: false, vac: true, date: "2026.08.27 09:15" },
  { name: "한지우", pre: true, vac: false, date: "2026.08.11 17:02" }
];
function staffSummary() {
  if (!staffList.length) return `<span class="muted">등록된 의료진이 없습니다.</span>`;
  const count = k => staffList.filter(s => staffKind(s) === k).length;
  return `<span class="staff-total">총 ${staffList.length}명</span>
    <span class="staff-count">예진 <b>${count("pre")}</b></span>
    <span class="staff-count">접종 <b>${count("vac")}</b></span>
    <span class="staff-count">예진·접종 <b>${count("both")}</b></span>`;
}
function staffKind(s) {
  if (s.pre && s.vac) return "both";
  if (s.pre) return "pre";
  if (s.vac) return "vac";
  return "none";
}
function openStaff() {
  const back = document.getElementById("staff-modal");
  if (!back) return;
  let draft = staffList.map(s => ({ ...s }));
  let filter = "all";
  let keyword = "";
  let dirty = false;
  back.innerHTML = `<div class="modal staff" role="dialog" aria-label="의료진 관리">
    <div class="staff-head">
      <h3>의료진 관리</h3>
      <div class="staff-bar">
        <label class="staff-search"><span aria-hidden="true">⌕</span><input type="text" id="staff-keyword" placeholder="이름 검색"></label>
        <button class="btn fill" type="button" id="staff-search">검색</button>
        <div class="chips" id="staff-chips"></div>
      </div>
    </div>
    <div class="staff-entry">
      <div class="staff-row new">
        <input type="text" class="staff-name" id="staff-new-name" placeholder="의료진명을 입력해주세요.">
        <label class="check"><input type="checkbox" id="staff-new-pre" checked> 예진</label>
        <label class="check"><input type="checkbox" id="staff-new-vac"> 접종</label>
        <button type="button" class="staff-plus" id="staff-add" aria-label="의료진 추가">+</button>
      </div>
    </div>
    <div class="staff-list-head"><span>등록된 의료진</span><span class="muted">최근 등록순</span></div>
    <div class="staff-body" id="staff-body"></div>
    <div class="staff-foot">
      <div class="staff-actions"><button class="btn round ghost" type="button" id="staff-close">닫기</button><button class="btn round fill" type="button" id="staff-save" disabled>저장</button></div>
    </div>
  </div>`;
  back.classList.add("on");
  const body = document.getElementById("staff-body");
  const chips = document.getElementById("staff-chips");
  const save = document.getElementById("staff-save");
  const touch = () => { dirty = true; save.disabled = false; };
  const renderChips = () => {
    const count = k => k === "all" ? draft.length : draft.filter(s => staffKind(s) === k).length;
    chips.innerHTML = [["all", "전체"], ["pre", "예진"], ["vac", "접종"], ["both", "예진·접종"]]
      .map(([k, label]) => `<button type="button" class="chip ${filter === k ? "on" : ""}" data-chip="${k}">${label} ${count(k)}</button>`).join("");
    chips.querySelectorAll("[data-chip]").forEach(btn => btn.addEventListener("click", () => { filter = btn.dataset.chip; render(); }));
  };
  const render = () => {
    renderChips();
    const rows = draft
      .map((s, i) => ({ s, i }))
      .filter(({ s }) => (filter === "all" || staffKind(s) === filter) && (!keyword || s.name.includes(keyword)));
    if (!draft.length) {
      body.innerHTML = `<div class="staff-empty"><span aria-hidden="true">👥</span><p>등록된 의료진이 없습니다.</p></div>`;
      return;
    }
    if (!rows.length) {
      body.innerHTML = `<div class="staff-empty"><p>조건에 맞는 의료진이 없습니다.</p></div>`;
      return;
    }
    body.innerHTML = `<table class="staff-table">
      <thead><tr><th>의료진명</th><th>예진권한</th><th>접종권한</th><th>등록일자</th><th>삭제</th></tr></thead>
      <tbody>${rows.map(({ s, i }) => `<tr class="staff-tr" data-idx="${i}">
        <td class="staff-name-cell">${s.name}</td>
        <td>${s.pre ? '<span class="staff-mark" aria-label="예진권한 있음">✓</span>' : '<span class="staff-none">-</span>'}</td>
        <td>${s.vac ? '<span class="staff-mark" aria-label="접종권한 있음">✓</span>' : '<span class="staff-none">-</span>'}</td>
        <td class="staff-date">${s.date || ""}</td>
        <td><button type="button" class="staff-del">삭제</button></td>
      </tr>`).join("")}</tbody>
    </table>`;
    body.querySelectorAll(".staff-tr").forEach(rowEl => {
      const s = draft[Number(rowEl.dataset.idx)];
      rowEl.querySelector(".staff-del").addEventListener("click", () => { draft.splice(draft.indexOf(s), 1); touch(); render(); });
    });
  };
  render();
  const close = () => back.classList.remove("on");
  document.getElementById("staff-close").addEventListener("click", close);
  back.onclick = (e) => { if (e.target === back) close(); };
  const newName = document.getElementById("staff-new-name");
  const newPre = document.getElementById("staff-new-pre");
  const newVac = document.getElementById("staff-new-vac");
  const addStaff = () => {
    const name = newName.value.trim();
    if (!name) { showToast("의료진명을 입력해주세요."); newName.focus(); return; }
    if (!newPre.checked && !newVac.checked) { showToast("예진 또는 접종을 하나 이상 선택해주세요."); return; }
    const now = new Date();
    const date = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    draft.unshift({ name, pre: newPre.checked, vac: newVac.checked, date });
    newName.value = ""; newPre.checked = true; newVac.checked = false;
    filter = "all"; keyword = "";
    document.getElementById("staff-keyword").value = "";
    touch(); render();
    body.scrollTop = 0;
    newName.focus();
  };
  document.getElementById("staff-add").addEventListener("click", addStaff);
  const runSearch = () => { keyword = document.getElementById("staff-keyword").value.trim(); render(); };
  document.getElementById("staff-search").addEventListener("click", runSearch);
  document.getElementById("staff-keyword").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
  save.addEventListener("click", () => {
    if (!dirty) return;
    if (draft.some(s => !s.name.trim())) { showToast("의료진명을 입력해주세요."); return; }
    if (draft.some(s => !s.pre && !s.vac)) { showToast("예진 또는 접종을 하나 이상 선택해주세요."); return; }
    staffList = draft.map(s => ({ ...s, name: s.name.trim() }));
    const summary = document.getElementById("staff-summary");
    if (summary) summary.innerHTML = staffSummary();
    close();
    showToast("의료진을 저장했습니다.");
  });
}
function profileSlot() {
  if (!profileImage) {
    return `<button type="button" class="upload upload-btn" id="profile-upload">⇪<br>프로필 이미지를 업로드 해주세요.<br>(파일 최대 용량 2MB)</button>`;
  }
  const visual = profileImage === "default"
    ? `<div class="logo-mark">V<span>d</span>-IMS</div>`
    : `<img class="profile-img" src="${profileImage}" alt="병원 프로필 이미지">`;
  return `<div class="profile-logo">${visual}<div class="profile-actions"><button class="btn slim" type="button" id="profile-change">변경</button><button class="btn soft slim" type="button" id="profile-delete">삭제</button></div></div>`;
}
function bindProfileSlot() {
  const slot = document.getElementById("profile-slot");
  const file = document.getElementById("profile-file");
  if (!slot || !file) return;
  const pick = () => { file.value = ""; file.click(); };
  const upload = document.getElementById("profile-upload");
  if (upload) upload.addEventListener("click", pick);
  const change = document.getElementById("profile-change");
  if (change) change.addEventListener("click", pick);
  const del = document.getElementById("profile-delete");
  if (del) del.addEventListener("click", openProfileDelete);
  file.onchange = () => {
    const f = file.files[0];
    if (!f) return;
    if (f.size > 2 * 1024 * 1024) { showToast("파일 최대 용량은 2MB입니다."); return; }
    const reader = new FileReader();
    reader.onload = () => {
      profileImage = reader.result;
      slot.innerHTML = profileSlot();
      bindProfileSlot();
      showToast("프로필 이미지를 등록했습니다.");
    };
    reader.readAsDataURL(f);
  };
}
function openAdminVerified() {
  const back = document.getElementById("confirm-modal");
  if (!back) return;
  back.innerHTML = `<div class="modal confirm" role="dialog" aria-label="관리자 계정 인증">
    <div class="confirm-body"><h3>관리자 계정 인증</h3><p class="lead">관리자 계정은 1회 인증을 통해 갱신하지 않고 계속 사용할 수 있습니다.</p></div>
    <div class="modal-foot"><button class="btn round fill admin-home" type="button" id="admin-home">홈으로 이동하기</button></div>
  </div>`;
  back.onclick = null;
  back.classList.add("on");
  document.getElementById("admin-home").addEventListener("click", () => {
    back.classList.remove("on");
    go("hospital");
  });
}

function openPasswordChange() {
  const back = document.getElementById("confirm-modal");
  if (!back) return;
  back.innerHTML = `<form class="modal pw" role="dialog" aria-label="비밀번호 변경" id="pw-form">
    <div class="modal-scroll">
      <h3>비밀번호 변경</h3>
      <div class="modal-card">
        ${row("현재 비밀번호", `<input type="password" id="pw-current" placeholder="현재 비밀번호를 입력해주세요.">`)}
        ${row("새 비밀번호", `<input type="password" id="pw-new" placeholder="새 비밀번호를 입력해주세요.">`)}
        ${row("새 비밀번호 확인", `<input type="password" id="pw-confirm" placeholder="새 비밀번호를 다시 입력해주세요.">`)}
      </div>
    </div>
    <div class="modal-foot"><button class="btn round soft" type="button" id="pw-cancel">취소</button><button class="btn round fill" type="submit">변경</button></div>
  </form>`;
  back.classList.add("on");
  const close = () => back.classList.remove("on");
  document.getElementById("pw-cancel").addEventListener("click", close);
  back.onclick = (e) => { if (e.target === back) close(); };
  document.getElementById("pw-current").focus();
  document.getElementById("pw-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const current = document.getElementById("pw-current").value;
    const next = document.getElementById("pw-new").value;
    const confirmPw = document.getElementById("pw-confirm").value;
    if (!current || !next || !confirmPw) return showToast("비밀번호를 모두 입력해주세요.");
    if (next !== confirmPw) return showToast("새 비밀번호가 일치하지 않습니다.");
    if (next === current) return showToast("현재 비밀번호와 다른 비밀번호를 입력해주세요.");
    close();
    showToast("비밀번호를 변경했습니다.");
  });
}

function openProfileDelete() {
  const back = document.getElementById("confirm-modal");
  if (!back) return;
  back.innerHTML = `<div class="modal confirm" role="dialog" aria-label="프로필 이미지 삭제">
    <div class="confirm-body"><h3>프로필 이미지를 삭제할까요?</h3><p class="lead">삭제하면 이미지를 다시 업로드해야 합니다.</p></div>
    <div class="modal-foot"><button class="btn round soft" type="button" id="confirm-cancel">취소</button><button class="btn round fill" type="button" id="confirm-ok">삭제</button></div>
  </div>`;
  back.classList.add("on");
  const close = () => back.classList.remove("on");
  document.getElementById("confirm-cancel").addEventListener("click", close);
  back.onclick = (e) => { if (e.target === back) close(); };
  document.getElementById("confirm-ok").addEventListener("click", () => {
    close();
    profileImage = null;
    document.getElementById("profile-slot").innerHTML = profileSlot();
    bindProfileSlot();
    showToast("프로필 이미지를 삭제했습니다.");
  });
}

  else showToast("이 목업에서는 설정과 계정 관리를 확인합니다.");
}));
go("hospital");
</script>
