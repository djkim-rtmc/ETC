<svg width="820" height="1140" viewBox="0 0 820 1140" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>보건소 유저웹 접종 프로세스 전체 흐름도</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="820" height="1140" fill="#FFFFFF"/>

<style>
.node-gray rect{fill:#F2F2F2;stroke:#9AA0A6;}
.node-red rect{fill:#FBEAEA;stroke:#E24B4A;}
.node-teal rect{fill:#E6F5F0;stroke:#1D9E75;}
.th{font-size:15px;font-weight:700;fill:#1A1A1A;}
.ts{font-size:12px;fill:#555555;}
.arr{stroke:#444444;stroke-width:1.5;fill:none;}
</style>

<g class="node-gray"><rect x="230" y="20" width="300" height="56" rx="8" stroke-width="1"/>
<text class="th" x="380" y="40" text-anchor="middle" dominant-baseline="central">병원 QR 스캔</text>
<text class="ts" x="380" y="58" text-anchor="middle" dominant-baseline="central">유저웹 접속</text></g>
<line x1="380" y1="76" x2="380" y2="116" class="arr" marker-end="url(#arrow)"/>

<g class="node-gray"><rect x="230" y="116" width="300" height="56" rx="8" stroke-width="1"/>
<text class="th" x="380" y="144" text-anchor="middle" dominant-baseline="central">로그인</text></g>
<line x1="380" y1="172" x2="380" y2="212" class="arr" marker-end="url(#arrow)"/>

<g class="node-gray"><rect x="230" y="212" width="300" height="56" rx="8" stroke-width="1"/>
<text class="th" x="380" y="232" text-anchor="middle" dominant-baseline="central">오늘 접종하시나요?</text>
<text class="ts" x="380" y="250" text-anchor="middle" dominant-baseline="central">확인 팝업/페이지</text></g>
<path d="M230 240 L190 240" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="230" text-anchor="end">아니요</text>
<g class="node-gray"><rect x="40" y="212" width="150" height="56" rx="8" stroke-width="1"/>
<text class="th" x="115" y="240" text-anchor="middle" dominant-baseline="central">종료</text></g>

<line x1="380" y1="268" x2="380" y2="308" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="392" y="290">예</text>

<g class="node-gray"><rect x="230" y="308" width="300" height="56" rx="8" stroke-width="1"/>
<text class="th" x="380" y="328" text-anchor="middle" dominant-baseline="central">접종 대상자 선택</text>
<text class="ts" x="380" y="346" text-anchor="middle" dominant-baseline="central">본인 / 가족</text></g>

<line x1="380" y1="364" x2="380" y2="404" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="392" y="386">본인</text>
<path d="M530 336 L650 336 L650 404" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="560" y="326">가족</text>

<g class="node-red"><rect x="230" y="404" width="300" height="56" rx="8" stroke-width="1"/>
<text class="th" x="380" y="424" text-anchor="middle" dominant-baseline="central">주민번호·주소 입력</text>
<text class="ts" x="380" y="442" text-anchor="middle" dominant-baseline="central">본인</text></g>

<g class="node-gray"><rect x="540" y="404" width="220" height="56" rx="8" stroke-width="1"/>
<text class="th" x="650" y="424" text-anchor="middle" dominant-baseline="central">가족 선택</text>
<text class="ts" x="650" y="442" text-anchor="middle" dominant-baseline="central">기존 선택 또는 신규 추가</text></g>
<line x1="650" y1="460" x2="650" y2="484" class="arr" marker-end="url(#arrow)"/>

<g class="node-red"><rect x="540" y="484" width="220" height="70" rx="8" stroke-width="1"/>
<text class="th" x="650" y="507" text-anchor="middle" dominant-baseline="central">가족 정보 입력</text>
<text class="ts" x="650" y="527" text-anchor="middle" dominant-baseline="central">관계·쌍둥이여부·주민번호·주소</text></g>

<line x1="380" y1="460" x2="380" y2="604" class="arr" marker-end="url(#arrow)"/>
<path d="M650 554 L650 580 L380 580 L380 604" class="arr" marker-end="url(#arrow)"/>

<g class="node-teal"><rect x="230" y="604" width="300" height="56" rx="8" stroke-width="1"/>
<text class="th" x="380" y="624" text-anchor="middle" dominant-baseline="central">접종자 QR 생성</text>
<text class="ts" x="380" y="642" text-anchor="middle" dominant-baseline="central">유저ID 기반 세션 토큰</text></g>
<line x1="380" y1="660" x2="380" y2="700" class="arr" marker-end="url(#arrow)"/>

<g class="node-teal"><rect x="230" y="700" width="300" height="56" rx="8" stroke-width="1"/>
<text class="th" x="380" y="720" text-anchor="middle" dominant-baseline="central">RTMC-TAB QR 스캔</text>
<text class="ts" x="380" y="738" text-anchor="middle" dominant-baseline="central">미란다헬스케어 접종자 정보 표시</text></g>
<line x1="380" y1="756" x2="380" y2="796" class="arr" marker-end="url(#arrow)"/>

<g class="node-teal"><rect x="230" y="796" width="300" height="56" rx="8" stroke-width="1"/>
<text class="th" x="380" y="816" text-anchor="middle" dominant-baseline="central">백신 스캔</text>
<text class="ts" x="380" y="834" text-anchor="middle" dominant-baseline="central">접종 전송 진행</text></g>
<line x1="380" y1="852" x2="380" y2="892" class="arr" marker-end="url(#arrow)"/>

<g class="node-gray"><rect x="230" y="892" width="300" height="56" rx="8" stroke-width="1"/>
<text class="th" x="380" y="912" text-anchor="middle" dominant-baseline="central">질병청 서버 전송</text>
<text class="ts" x="380" y="930" text-anchor="middle" dominant-baseline="central">접종정보 전송 시도</text></g>

<path d="M380 948 L380 968 L290 968 L290 988" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="300" y="960" text-anchor="start">성공</text>
<path d="M380 948 L380 968 L610 968 L610 988" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="560" y="960" text-anchor="end">실패</text>

<g class="node-red"><rect x="150" y="988" width="280" height="56" rx="8" stroke-width="1"/>
<text class="th" x="290" y="1008" text-anchor="middle" dominant-baseline="central">전송 성공 (ACK)</text>
<text class="ts" x="290" y="1026" text-anchor="middle" dominant-baseline="central">주민번호·주소 즉시 파기</text></g>

<g class="node-gray"><rect x="470" y="988" width="280" height="56" rx="8" stroke-width="1"/>
<text class="th" x="610" y="1008" text-anchor="middle" dominant-baseline="central">전송 실패 · 실패 팝업</text>
<text class="ts" x="610" y="1026" text-anchor="middle" dominant-baseline="central">즉시 재전송 또는 Vd-IMS 재전송</text></g>
<path d="M750 1016 L790 1016 L790 920 L530 920" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="793" y="970" text-anchor="start" transform="rotate(90 793 970)">재시도</text>

<rect x="30" y="1085" width="14" height="14" rx="3" fill="#9AA0A6"/>
<text class="ts" x="52" y="1095">일반 진행</text>
<rect x="140" y="1085" width="14" height="14" rx="3" fill="#E24B4A"/>
<text class="ts" x="162" y="1095">RRN·주소 처리 지점</text>
<rect x="330" y="1085" width="14" height="14" rx="3" fill="#1D9E75"/>
<text class="ts" x="352" y="1095">접종 처리 단계</text>
</svg>
